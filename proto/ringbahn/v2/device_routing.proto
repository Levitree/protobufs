syntax = "proto3";

package ringbahn.v2;

import "ringbahn/v2/enums.proto";
import "ringbahn/v2/types.proto";

// ============================================================================
// Bridge-Local Commands
// ============================================================================
//
// These commands are sent with device_uuid = bridge's own UUID in the Ringbahn
// frame header. They are handled by the bridge itself and NOT forwarded to
// any CAN device.
//
// Categories:
//   - Device discovery: list devices on the CAN bus
//   - Bridge state: operational status, GPS, bus load
//   - Bridge firmware OTA: update the bridge's own firmware
//   - Terraboot bridge: proxy bootloader commands to CAN devices
//

// ============================================================================
// Device Discovery
// ============================================================================

// Request a list of all devices currently discovered on the CAN bus.
// The bridge maintains this list from admin discovery (CAN IDs 0x3F0/0x3F1).
// Response: AttachedDevicesResponse
message GetAttachedDevicesRequest {}

// Response to GetAttachedDevicesRequest.
message AttachedDevicesResponse {
  // All devices the bridge has discovered and assigned CAN short IDs to.
  // Ordered by discovery time (oldest first).
  // Maximum 29 devices per CAN bus (limited by the 32-ID block scheme).
  repeated AttachedDevice devices = 1;
}

// Information about a single discovered device on the CAN bus.
message AttachedDevice {
  DeviceType device_type = 1; // Device variant (SDADC, BLDC, etc.)
  DeviceUUID device_uuid = 2; // 6-byte manufacturing UUID

  // NEW in v2: Current subscription state for this device.
  // Bitmask of channels the PC has subscribed to via SubscribeRequest.
  //
  // This allows the PC to recover subscription state after a reconnect
  // (e.g. BLE disconnect/reconnect) without having to re-query each device.
  // The bridge maintains this state internally and reports it here.
  uint32 subscribed_channels = 3;
}

// ============================================================================
// Bridge State
// ============================================================================

// Query the bridge's own operational state.
// Response: BridgeState
message GetBridgeStateRequest {}

// Bridge operational state.
message BridgeState {
  // Number of devices currently on the CAN bus (same as devices.length
  // from GetAttachedDevicesRequest, but cheaper to query).
  uint32 connected_devices = 1;

  // Optional GPS state for mobile hubs with GPS modules (e.g. u-blox).
  // All fields are zero/false if no GPS hardware is present or no fix.
  GPSState gps_state = 2;

  // NEW in v2: Estimated CAN bus utilization as a percentage (0-100).
  // Calculated from observed frame rate vs theoretical max at 1 Mbps.
  // Useful for diagnostics: if bus load approaches 70-80%, consider
  // increasing hysteresis thresholds or reducing poll slot frequencies.
  uint32 can_bus_load_percent = 3;

  // NEW in v2: Bridge uptime in seconds since last reset.
  uint32 uptime_seconds = 4;
}

// ============================================================================
// Bootloader Entry
// ============================================================================

// Request a CAN device to enter bootloader mode.
// The bridge sends the bootloader entry command via the CAN admin channel.
// Response: CommandResult
//
// NOTE: The target device is identified by device_uuid in the Ringbahn frame,
// NOT by a field in this message. The bridge translates UUID -> CAN short_id
// and sends the admin bootloader command.
message BootloaderCommand {
  // Safety magic number to prevent accidental bootloader entry.
  // Must match the expected value or the command is rejected.
  uint32 magic = 1;
}

// ============================================================================
// Bridge Firmware OTA
// ============================================================================
//
// Updates the bridge's own firmware (not CAN devices -- use Terraboot for those).
// These commands are identical to v1 semantics, re-packaged under ringbahn.v2.
//
// FLOW:
//   1. ota_begin    -- Start OTA session, declare image size and version
//   2. ota_write    -- Stream firmware chunks (up to 4KB per Ringbahn message)
//   3. ota_end      -- Finalize image, optionally validate SHA256 checksum
//   4. ota_set_boot -- Mark the new image as the active boot partition
//   5. Reset the bridge to boot into new firmware
//
// ota_abort can be called at any point to cancel the OTA session.
// All responses are InternalOtaStatus with progress information.
//

// Begin an OTA firmware update session.
// Response: InternalOtaStatus
message InternalOtaBeginRequest {
  uint32 image_size = 1; // Total firmware image size in bytes
  uint32 firmware_version = 2; // Monotonic version number (for rollback detection)
}

// Write a chunk of firmware data to the OTA partition.
// Response: InternalOtaStatus
//
// Chunks must be sent sequentially with correct offsets (no gaps, no overlaps).
// The bridge validates that offset matches next_offset from the previous response.
message InternalOtaWriteRequest {
  bytes data = 1; // Firmware chunk (up to 4096 bytes per message)
  uint32 offset = 2; // Byte offset within the image
}

// Finalize the OTA image. Optionally compute and return SHA256 for verification.
// Response: InternalOtaStatus (includes sha256_hash if validate=true)
message InternalOtaEndRequest {
  bool validate_sha256 = 1; // If true, bridge computes SHA256 of the received image
}

// Cancel the current OTA session. Discards any partially written data.
// Response: InternalOtaStatus
message InternalOtaAbortRequest {}

// Set the OTA partition as the active boot partition.
// On next reset, the bridge will boot from the new firmware.
// Response: InternalOtaStatus
message InternalOtaSetBootRequest {}

// Progress and status information for OTA operations.
message InternalOtaStatus {
  uint32 bytes_written = 1; // Total bytes written to OTA partition so far
  uint32 free_space = 2; // Remaining space in the OTA partition
  bytes sha256_hash = 3; // SHA256 hash (32 bytes, only after ota_end with validate=true)
  uint32 next_offset = 4; // Expected offset for the next ota_write call
}

// ============================================================================
// Terraboot CAN Bootloader Bridge
// ============================================================================
//
// The bridge proxies Terraboot bootloader commands to CAN devices.
// This allows the PC to flash firmware to any device on the CAN bus
// through the bridge, without direct CAN access.
//
// ADDRESSING:
//   device_uuid in the Ringbahn frame = bridge's own UUID
//     (these commands are sent TO the bridge for proxying)
//   device_uuid in the protobuf message = target CAN device to bootload
//     (the bridge translates this to the CAN node address)
//
//   This is one of two places where a UUID appears in protobuf messages.
//   See bridge.proto header comment for the full rationale.
//
// FLOW:
//   1. terraboot_enter    -- Reset target device into Terraboot bootloader mode
//   2. terraboot_connect  -- Handshake with bootloader, get device capabilities
//   3. terraboot_send     -- Send firmware blocks (typically 256 bytes each)
//   4. terraboot_eof      -- Signal end of firmware image
//   5. terraboot_complete -- Finalize: validate, write boot record, reset device
//
// Additional utilities:
//   terraboot_request  -- Read a firmware block back from flash (for verification)
//   terraboot_get_id   -- Read the device's CAN UUID from the bootloader
//   terraboot_identify -- Blink the device LED for physical identification
//

// Reset a device into Terraboot bootloader mode.
// The bridge sends the bootloader entry command via CAN admin channel.
// The device resets and starts its Terraboot bootloader instead of the application.
// Response: AcknowledgeResponse
message TerrabootEnterRequest {
  DeviceUUID device_uuid = 1; // Target device to reset into bootloader
}

// Establish a bootloader session with a device in Terraboot mode.
// Returns device capabilities (MCU type, flash layout, current firmware info).
// Response: TerrabootConnectResponse
message TerrabootConnectRequest {
  DeviceUUID device_uuid = 1;
}

// Response to TerrabootConnectRequest.
// Contains everything the PC needs to know to flash this device.
message TerrabootConnectResponse {
  uint32 protocol_version = 1; // Terraboot protocol version (for compatibility checks)
  uint32 start_address = 2; // Flash start address for application code
  uint32 block_size = 3; // Size of each firmware block (typically 256 bytes)
  uint32 flash_size = 4; // Total flash available for application code
  string mcu_type = 5; // MCU identification (e.g. "STM32F103C8")
  string terraboot_version = 6; // Bootloader version string
  string app_variant = 7; // Currently installed application variant name
  string app_version = 8; // Currently installed application version string
}

// Send a firmware block to the device's flash.
// Blocks must be sent in order (ascending block_address).
// Response: TerrabootSendBlockResponse
message TerrabootSendBlockRequest {
  DeviceUUID device_uuid = 1;
  uint32 block_address = 2; // Flash address for this block (must be aligned to block_size)
  bytes data = 3; // Block data (exactly block_size bytes, typically 256)
}

// Response to TerrabootSendBlockRequest.
message TerrabootSendBlockResponse {
  uint32 block_address = 1; // Echo of the written block address (write confirmation)
}

// Signal that all firmware blocks have been sent.
// The bootloader finalizes the image (writes metadata, computes checksums).
// Response: TerrabootEofResponse
message TerrabootEofRequest {
  DeviceUUID device_uuid = 1;
}

// Response to TerrabootEofRequest.
message TerrabootEofResponse {
  uint32 page_count = 1; // Total number of flash pages written
}

// Read a firmware block back from the device's flash.
// Used for post-write verification (compare with what was sent).
// Response: TerrabootRequestBlockResponse
message TerrabootRequestBlockRequest {
  DeviceUUID device_uuid = 1;
  uint32 block_address = 2; // Flash address to read (aligned to block_size)
}

// Response to TerrabootRequestBlockRequest.
message TerrabootRequestBlockResponse {
  uint32 block_address = 1; // Echo of the requested address
  bytes data = 2; // Block data read from flash (block_size bytes)
}

// Finalize the bootloader session.
// The device validates the new firmware, updates its boot record, and resets
// into the new application code.
// Response: TerrabootCompleteResponse
message TerrabootCompleteRequest {
  DeviceUUID device_uuid = 1;
}

// Response to TerrabootCompleteRequest.
// Empty -- success is indicated by receiving the response (no error).
message TerrabootCompleteResponse {}

// Read the device's CAN UUID from the bootloader.
// Useful when a device's UUID is unknown (e.g. new/replacement hardware).
// Response: TerrabootGetIdResponse
message TerrabootGetIdRequest {
  DeviceUUID device_uuid = 1; // Can be a broadcast/wildcard if supported
}

// Response to TerrabootGetIdRequest.
message TerrabootGetIdResponse {
  // CAN UUID of the device (6 bytes).
  // Terraboot internally pads this to 12 bytes; the bridge truncates to 6.
  bytes can_uuid = 1;
}

// Blink the device LED for physical identification while in bootloader mode.
// Response: TerrabootIdentifyResponse
message TerrabootIdentifyRequest {
  DeviceUUID device_uuid = 1;
}

// Response to TerrabootIdentifyRequest. Empty -- success indicated by response.
message TerrabootIdentifyResponse {}

// ============================================================================
// WiFi Management (bridge-local, routing devices only)
// ============================================================================
//
// Available on hub/node routing devices that have CONFIG_HAS_WIFI enabled.
// All commands are handled locally by the bridge; never forwarded to CAN.
//
// FLOW:
//   1. wifi_list   -- Scan for available networks (active scan, ~1.5s)
//   2. wifi_connect -- Provide SSID + optional PSK; bridge stores in NVS
//                      and attempts to associate
//   3. wifi_status -- Query current association state (IP, SSID, uptime)
//   4. wifi_disconnect -- Disassociate and clear stored credentials
//

// Encryption / authentication mode reported by a scanned network.
// Values are aligned with esp-idf's wifi_auth_mode_t for direct mapping.
enum WifiEncryptionType {
  WIFI_ENCRYPTION_TYPE_UNSPECIFIED = 0;
  WIFI_ENCRYPTION_TYPE_OPEN = 1;
  WIFI_ENCRYPTION_TYPE_WEP = 2;
  WIFI_ENCRYPTION_TYPE_WPA_PSK = 3;
  WIFI_ENCRYPTION_TYPE_WPA2_PSK = 4;
  WIFI_ENCRYPTION_TYPE_WPA_WPA2_PSK = 5;
  WIFI_ENCRYPTION_TYPE_WPA2_ENTERPRISE = 6;
  WIFI_ENCRYPTION_TYPE_WPA3_PSK = 7;
  WIFI_ENCRYPTION_TYPE_WPA2_WPA3_PSK = 8;
  WIFI_ENCRYPTION_TYPE_WAPI_PSK = 9;
}

// A single WiFi network discovered by an active scan.
message WifiNetwork {
  string ssid = 1;                        // SSID (UTF-8, up to 32 bytes)
  int32 rssi = 2;                         // Signal strength in dBm (typically -30 to -95)
  WifiEncryptionType encryption_type = 3; // Authentication mode
}

// Trigger an active scan and return all networks visible to the radio.
// Response: WifiNetworksResponse
//
// Blocks the calling task for ~1500ms (typical scan duration) while the
// radio sweeps all channels. The bridge serializes scans -- a second
// request while a scan is in flight returns error_code=3 (busy).
message WifiListNetworksRequest {}

// Response to WifiListNetworksRequest.
message WifiNetworksResponse {
  // Networks ordered by descending RSSI. Limited to 16 entries to keep the
  // encoded message under the Ringbahn payload ceiling. Duplicate SSIDs
  // (e.g. multiple APs in a mesh) are coalesced to the strongest entry.
  repeated WifiNetwork networks = 1;
}

// Associate with a network. Credentials are persisted to NVS so the bridge
// auto-connects on subsequent boots. Replaces any previously stored creds.
// Response: CommandResult
//
// success=true means the configuration was accepted and an association
// attempt was started; it does NOT mean the device has an IP yet. Poll
// wifi_status (or subscribe to the WiFi state event channel, future work)
// to observe the connect outcome.
message WifiConnectNetworkRequest {
  string ssid = 1;     // Required, 1-32 UTF-8 bytes
  string psk = 2;      // Optional; empty / omitted for OPEN networks
}

// Disassociate and clear stored credentials. The bridge stops attempting
// auto-connect until new credentials are provided.
// Response: CommandResult
message WifiDisconnectNetworkRequest {}

// Query the current WiFi association state.
// Response: WifiStatus
message WifiGetNetworkStatusRequest {}

// Current WiFi association state.
message WifiStatus {
  bool connected = 1;            // True if associated AND has an IPv4 lease
  string ssid = 2;               // SSID of the current/last association (may be empty)
  string ip = 3;                 // Dotted-quad IPv4 address (empty if not connected)
  uint32 uptime_seconds = 4;     // Seconds since the most recent successful association
                                 // (0 when not connected; resets on each (re)connect)
}

// ============================================================================
// Device Name (bridge-local, routing devices only)
// ============================================================================
//
// Human-readable name for the bridge itself, assigned by the host (the
// backend database is the source of truth). The bridge persists it to NVS
// and uses it as its BLE GAP / advertisement name in place of the default
// "terranova-XXXX" (derived from the BT MAC). The stored name survives
// reboots and firmware updates; it does NOT affect the mDNS hostname.
//
// The host re-pushes the name on every connect (idempotent), so a bridge
// that lost NVS (factory erase) converges back to the configured name.

// Set or clear the bridge's device name. Persisted to NVS and applied to
// BLE advertising immediately (no reboot required).
// Response: CommandResult
message SetBridgeNameRequest {
  // 0-31 UTF-8 bytes. Empty clears the stored name, reverting the bridge
  // to its default "terranova-XXXX" advertisement name.
  //
  // The 31-byte ADV packet budget (flags + manufacturer data + name) only
  // fits ~16 name bytes; longer names are truncated in the ADV payload
  // (name_is_complete=0) but remain complete in the GAP device-name
  // characteristic, which clients read after connecting.
  string name = 1;
}

// Query the name currently stored in NVS.
// Response: BridgeNameResponse
message GetBridgeNameRequest {}

// Response to GetBridgeNameRequest.
message BridgeNameResponse {
  // Stored name, or empty if none is set (bridge advertises its default
  // "terranova-XXXX" name).
  string name = 1;
}

// ============================================================================
// Bluetooth Devices (bridge-local, routing devices only)
// ============================================================================
//
// The bridge acts as a BLE central and manages a small list of known (bonded)
// Bluetooth devices. The host sees *generic* devices: address, name, class
// (derived from the GAP Appearance, for icons), connectivity, and the usage
// the bridge has assigned. What the bridge does with a paired device is
// decided by the bridge from the device class (a class -> driver table); the
// first driver turns a gamepad/joystick into rover control (BLDC broadcast
// control frames on the CAN bus, exactly like the physical BLDC controller).
//
// FLOW:
//   1. bluetooth_scan_start   -- Active scan for duration_ms; results accumulate
//                                on the bridge. discovered_count in the status
//                                event bumps as devices appear.
//   2. bluetooth_scan_results -- Page through the accumulated results (offset).
//   3. bluetooth_pair         -- Connect + bond a device from the scan results.
//                                Outcome arrives via the status event
//                                (pair_phase, known list).
//   4. bluetooth_status       -- Snapshot of known devices / scan / pair state.
//   5. bluetooth_forget       -- Drop the bond and remove from the known list.
//
// LIVE STATUS:
//   Subscribe to bridge channel 2 (SubscribeRequest with channel_mask bit 2,
//   device_uuid = bridge UUID) to receive BluetoothStatusEvent pushes.
//
// LIMITS:
//   Known list: 3 devices. Scan results: 16 on the bridge, 4 per page (the
//   Ringbahn payload ceiling is 245 bytes).
//

// BLE address type of a peer's identity address.
enum BleAddressType {
  BLE_ADDRESS_TYPE_UNSPECIFIED = 0;
  BLE_ADDRESS_TYPE_PUBLIC = 1;
  BLE_ADDRESS_TYPE_RANDOM = 2; // static random / resolvable (identity address)
}

// 6-byte BLE identity address + type. Stable across reconnects even for peers
// that advertise with resolvable private addresses.
message BluetoothAddress {
  bytes value = 1; // Exactly 6 bytes, big-endian as printed (AA:BB:CC:DD:EE:FF)
  BleAddressType type = 2;
}

// Coarse device class for UI icons, derived by the bridge from the GAP
// Appearance value (category = appearance >> 6):
//   0x001 PHONE, 0x002 COMPUTER, 0x003 WATCH, 0x006 REMOTE_CONTROL,
//   0x008/0x009 TAG, 0x00C/0x00D/0x00E/0x010/0x011/0x012/0x031/0x033 SENSOR,
//   0x00F HID -> subtype (appearance & 0x3F): 1 KEYBOARD, 2 MOUSE,
//         3 JOYSTICK, 4 GAMEPAD, other HID_OTHER,
//   0x021 SPEAKER (audio sink), 0x025 HEADSET (wearable audio),
//   any other non-zero category -> OTHER.
// Without an appearance: HID service (0x1812) -> HID_OTHER, heart-rate (0x180D)
// or health thermometer (0x1809) service -> SENSOR, else UNSPECIFIED (unknown).
enum BluetoothDeviceClass {
  BLUETOOTH_DEVICE_CLASS_UNSPECIFIED = 0; // Unknown
  BLUETOOTH_DEVICE_CLASS_GAMEPAD = 1;
  BLUETOOTH_DEVICE_CLASS_JOYSTICK = 2;
  BLUETOOTH_DEVICE_CLASS_KEYBOARD = 3;
  BLUETOOTH_DEVICE_CLASS_MOUSE = 4;
  BLUETOOTH_DEVICE_CLASS_HID_OTHER = 5;
  BLUETOOTH_DEVICE_CLASS_SPEAKER = 6;
  BLUETOOTH_DEVICE_CLASS_HEADSET = 7;
  BLUETOOTH_DEVICE_CLASS_PHONE = 8;
  BLUETOOTH_DEVICE_CLASS_COMPUTER = 9;
  BLUETOOTH_DEVICE_CLASS_WATCH = 10;
  BLUETOOTH_DEVICE_CLASS_REMOTE_CONTROL = 11;
  BLUETOOTH_DEVICE_CLASS_SENSOR = 12;
  BLUETOOTH_DEVICE_CLASS_TAG = 13;
  BLUETOOTH_DEVICE_CLASS_OTHER = 14;
}

// What the bridge does with a known device. Assigned by the bridge from the
// device class; the host only displays it.
enum BluetoothDeviceUsage {
  BLUETOOTH_DEVICE_USAGE_UNSPECIFIED = 0;
  BLUETOOTH_DEVICE_USAGE_NONE = 1; // Bonded, but no driver: not auto-connected
  BLUETOOTH_DEVICE_USAGE_ROVER_CONTROL = 2; // Gamepad/joystick driver -> BLDC broadcast frames
}

// Progress of the most recent pairing attempt.
enum BluetoothPairPhase {
  BLUETOOTH_PAIR_PHASE_UNSPECIFIED = 0;
  BLUETOOTH_PAIR_PHASE_IDLE = 1; // No attempt in flight (last one succeeded or none yet)
  BLUETOOTH_PAIR_PHASE_CONNECTING = 2;
  BLUETOOTH_PAIR_PHASE_PAIRING = 3; // Connected; bonding / service setup in progress
  BLUETOOTH_PAIR_PHASE_FAILED = 4; // See BluetoothStatus.pair_error
}

// A bonded device in the bridge's known list.
message KnownBluetoothDevice {
  BluetoothAddress address = 1;
  string name = 2; // GAP name captured at pairing (may be empty)
  BluetoothDeviceClass device_class = 3;
  uint32 appearance = 4; // Raw GAP appearance, 0 = unknown
  BluetoothDeviceUsage usage = 5;
  bool connected = 6;
  sint32 rssi = 7; // dBm, meaningful only while connected
  // true while the driver is acting on the device's input (e.g. publishing
  // drive frames). false while disconnected, or while a host emergency stop
  // has latched the driver off until the controls return to neutral.
  bool active = 8;
}

// Snapshot of the bridge's Bluetooth state. Also the payload of
// BluetoothStatusEvent (bridge channel 2).
message BluetoothStatus {
  bool scanning = 1;
  repeated KnownBluetoothDevice known = 2; // At most 3
  // Number of scan results accumulated so far. Increments as devices are
  // found; hosts refetch bluetooth_scan_results when it changes.
  uint32 discovered_count = 3;
  BluetoothPairPhase pair_phase = 4;
  // NimBLE host / SM reason code of the last failed pairing, 0 = none.
  uint32 pair_error = 5;
}

// A device seen during the most recent scan.
message DiscoveredBluetoothDevice {
  BluetoothAddress address = 1;
  string name = 2; // Advertised name, may be empty
  BluetoothDeviceClass device_class = 3;
  uint32 appearance = 4; // Raw GAP appearance from the advert, 0 = absent
  sint32 rssi = 5; // dBm
  bool known = 6; // Already in the known list
}

// Query the Bluetooth snapshot.
// Response: BluetoothStatus
message GetBluetoothStatusRequest {}

// Start an active scan. Non-blocking: returns as soon as the scan starts.
// Response: CommandResult (error_code 3 = a scan or pairing is in progress)
message BluetoothStartScanRequest {
  uint32 duration_ms = 1; // 0 = bridge default (8000); clamped to 30000
  // Only report devices of this class. UNSPECIFIED = all devices.
  BluetoothDeviceClass class_filter = 2;
}

// Stop a running scan early. No-op if none is running.
// Response: CommandResult
message BluetoothStopScanRequest {}

// Fetch one page of the most recent scan's results, ordered by RSSI desc.
// Response: BluetoothScanResults
message GetBluetoothScanResultsRequest {
  uint32 offset = 1; // Index of the first result to return
}

// One page of scan results.
message BluetoothScanResults {
  bool scanning = 1; // true while the scan is still running
  uint32 total = 2; // Total results accumulated on the bridge
  uint32 offset = 3; // Echo of the request offset
  repeated DiscoveredBluetoothDevice results = 4; // At most 4 per page
}

// Connect to and bond with a device from the current scan results.
// Non-blocking: success means the attempt started. Outcome via the status
// event / bluetooth_status (pair_phase, known list).
// Response: CommandResult
//   error_code 2 = address not in the current scan results
//   error_code 3 = a scan or pairing is in progress
//   error_code 8 = known list is full (forget a device first)
message BluetoothPairRequest {
  BluetoothAddress address = 1;
}

// Disconnect (if connected), delete the bond and remove from the known list.
// Response: CommandResult (error_code 2 = address not known)
message BluetoothForgetRequest {
  BluetoothAddress address = 1;
}

// ============================================================================
// Throughput Test (bridge-local)
// ============================================================================
//
// Round-trip echo for measuring link throughput and latency between the PC
// and the bridge. The bridge replies with the same bytes it received.
// Always handled locally regardless of frame device_uuid; never forwarded
// to CAN.

message ThroughputTestRequest {
  bytes payload = 1; // Arbitrary bytes; echoed back verbatim
}

message ThroughputTestResponse {
  bytes payload = 1; // Same bytes the bridge received
}

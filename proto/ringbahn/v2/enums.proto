syntax = "proto3";

package ringbahn.v2;

// Device variant types. Assigned at firmware build time.
// The bridge discovers device types during admin enumeration on the CAN bus.
enum DeviceType {
  DEVICE_TYPE_UNSPECIFIED = 0; // Unknown or uninitialized
  DEVICE_TYPE_ROUTING = 1; // PC-CAN bridge (routing device). Was HUB in v1.
  reserved 2; // Was DEVICE_TYPE_NODE — now represented by RoutingDeviceType
  DEVICE_TYPE_SD_ADC = 3; // Sigma-delta ADC (AD4111-based, 8 current + 4 voltage)
  reserved 4; // Was DEVICE_TYPE_DIGITAL_OUT — replaced by DEVICE_TYPE_IO
  DEVICE_TYPE_RS485_BRIDGE = 5; // Modbus RTU bridge (RS485 UART to CAN)
  DEVICE_TYPE_BLDC = 6; // Brushless DC motor controller (2 channels)
  DEVICE_TYPE_BLDC_CONTROLLER = 7; // Joystick/button controller for BLDC board
  DEVICE_TYPE_IO = 8; // Digital IO module (4x digital input + 4x digital output)
  DEVICE_TYPE_DC = 9; // Brushed DC motor module (4x DRV8876 H-bridge + 8x digital input)
  DEVICE_TYPE_TERRABOOT = 254; // Device is in bootloader mode (no application running)
}

// Distinguishes how a routing device connects to the host.
// Both Hub and Node boards are functionally identical routing devices;
// the difference is the transport to the host (USB/BLE vs Xbee).
enum RoutingDeviceType {
  ROUTING_DEVICE_TYPE_UNSPECIFIED = 0;
  ROUTING_DEVICE_TYPE_HUB = 1; // Direct connection (USB/BLE)
  ROUTING_DEVICE_TYPE_NODE = 2; // Remote connection (Xbee)
}

// RS485 UART baud rate options for modbus bridge configuration.
enum SerialBaudRate {
  SERIAL_BAUD_RATE_UNSPECIFIED = 0;
  SERIAL_BAUD_RATE_1200 = 1;
  SERIAL_BAUD_RATE_2400 = 2;
  SERIAL_BAUD_RATE_4800 = 3;
  SERIAL_BAUD_RATE_9600 = 4;
  SERIAL_BAUD_RATE_19200 = 5; // Default for most modbus slaves
  SERIAL_BAUD_RATE_38400 = 6;
  SERIAL_BAUD_RATE_57600 = 7;
  SERIAL_BAUD_RATE_115200 = 8;
}

// UART parity options.
enum SerialParity {
  SERIAL_PARITY_UNSPECIFIED = 0;
  SERIAL_PARITY_NONE = 1; // Default
  SERIAL_PARITY_ODD = 2;
  SERIAL_PARITY_EVEN = 3;
}

// UART stop bit options.
enum SerialStopBits {
  SERIAL_STOP_BITS_UNSPECIFIED = 0;
  SERIAL_STOP_BITS_1 = 1; // Default
  SERIAL_STOP_BITS_2 = 2;
}

// Firmware variant identifier. Indicates which application firmware is
// running on a device. Reported in GetVersionResponse.fw_variant.
enum FirmwareVariant {
  FIRMWARE_VARIANT_UNSPECIFIED = 0;
  FIRMWARE_VARIANT_SDADC = 1; // Sigma-delta ADC
  reserved 2; // Was FIRMWARE_VARIANT_DIGITAL_OUTPUT — replaced by FIRMWARE_VARIANT_IO
  FIRMWARE_VARIANT_MODBUS_BRIDGE = 3; // Modbus RTU bridge
  FIRMWARE_VARIANT_BLDC_MOTOR = 4; // BLDC motor controller
  FIRMWARE_VARIANT_ADC_CONTROLLER = 5; // ADC joystick/button controller
  FIRMWARE_VARIANT_IO = 6; // Digital IO module (4x input + 4x output)
  FIRMWARE_VARIANT_DC = 7; // Brushed DC motor module (4x H-bridge + 8x input)
}

// Per-motor mode on the DC variant (DEVICE_TYPE_DC).
//   FREE    — speed/direction taken directly from SetDCMotorSpeedRequest.
//   ENDSTOP — same, but two assigned inputs gate motion per direction. When
//             a commanded motion would push into an active endstop, the
//             firmware zeros the commanded speed. Host must re-send to retry
//             (no auto-resume on limit release).
enum DCMotorMode {
  DC_MOTOR_MODE_UNSPECIFIED = 0;
  DC_MOTOR_MODE_FREE = 1;
  DC_MOTOR_MODE_ENDSTOP = 2;
}

// Modbus function codes for read operations.
// Used in ModbusReadRequest and ModbusSetPollRequest.
enum ModbusFunction {
  MODBUS_FUNCTION_UNSPECIFIED = 0;
  MODBUS_FUNCTION_READ_COILS = 1; // FC 0x01 - Read coils
  MODBUS_FUNCTION_READ_DISCRETE_INPUTS = 2; // FC 0x02 - Read discrete inputs
  MODBUS_FUNCTION_READ_HOLDING_REGISTERS = 3; // FC 0x03 - Read holding registers
  MODBUS_FUNCTION_READ_INPUT_REGISTERS = 4; // FC 0x04 - Read input registers
}

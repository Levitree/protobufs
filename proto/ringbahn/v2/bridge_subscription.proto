syntax = "proto3";

package ringbahn.v2;

// ============================================================================
// Bridge-Level Event Subscriptions
// ============================================================================
//
// Subscribe to events generated by the bridge itself (not forwarded from CAN
// devices). These are bridge-local commands (dst_uuid = bridge's own UUID).
//
// EVENT MASK BITS:
//   bit 0: Device presence (online/offline) - DevicePresenceEvent
//   bit 1: GPS state updates - GPSStateEvent
//   bits 2-31: Reserved for future use
//
// SEMANTICS:
//   Additive: subscribing to new event types does NOT unsubscribe from existing.
//   Selective unsubscribe: only specified bits are removed.
//   Per-transport: each BLE connection / UART / XBee endpoint has its own mask.
//   BLE disconnect: automatically clears all bridge subscriptions for that connection.
//

// Subscribe to bridge-level event categories.
// Response: CommandResult
message BridgeSubscribeRequest {
  uint32 event_mask = 1;
}

// Unsubscribe from bridge-level event categories.
// Response: CommandResult
message BridgeUnsubscribeRequest {
  uint32 event_mask = 1;
}

syntax = "proto3";

package ringbahn.v2;

import "ringbahn/v2/enums.proto";

// ============================================================================
// Modbus Bridge Commands
// ============================================================================
//
// The modbus bridge device (DEVICE_TYPE_RS485_BRIDGE) connects to Modbus RTU
// slaves via RS485 UART. It supports three modes of operation:
//
//   1. DIRECT READS -- PC sends a read request, bridge forwards to modbus slave,
//      returns the response. For reads of >3 registers, the modbus device sends
//      multi-frame CAN responses which the routing bridge reassembles.
//
//   2. DIRECT WRITES -- Single register/coil writes are single CAN frames.
//
//   3. POLL SLOTS -- Autonomous round-robin reads. The PC configures up to 16
//      poll slots, each reading a range of registers from a slave. All active
//      slots are polled as fast as possible in round-robin order.
//      Results are pushed as ModbusPollResultEvent (see events.proto).
//      The modbus device caches last-seen values per slot and only pushes when
//      register values actually change (change detection on device).
//
// TIMEOUT SAFETY:
//   The modbus bridge can store up to 8 "timeout commands" (writes) that execute
//   automatically if the PC stops sending commands (including pings). This ensures
//   safe shutdown of connected equipment if the PC crashes.
//   Example: "if we lose comms, write 0 to the VFD speed register."
//

// ============================================================================
// UART Configuration
// ============================================================================

// Configure the RS485 UART port parameters.
// Must be called before any modbus operations if defaults don't match the slave.
// Response: CommandResult
//
// CAN mapping: CMD_RX byte 0x23: [baud:1][parity:1][stop_bits:1]
message ModbusConfigureUartRequest {
  SerialBaudRate baud_rate = 1; // Default: SERIAL_BAUD_RATE_19200
  SerialParity parity = 2; // Default: SERIAL_PARITY_NONE
  SerialStopBits stop_bits = 3; // Default: SERIAL_STOP_BITS_1
}

// ============================================================================
// Direct Read
// ============================================================================

// Read registers or coils from a modbus slave.
// Response: ModbusReadResponse
//
// For reads of 1-3 registers, the modbus device responds in a single CAN frame
// on CMD_TX. For reads of 4+ registers, the device sends multiple CAN frames on
// data channel +0x12, which the routing bridge reassembles before encoding the
// protobuf response.
//
// CAN mapping:
//   CMD_RX byte 0x20: [slave:1][func:1][addr:2 LE][qty:2 LE][seq:1]
//   CMD_TX (small): [0x20][0x00][data...]
//   Data channel +0x12 (large): [seq:1][frame_idx:1][data:6]
message ModbusReadRequest {
  ModbusFunction function = 1; // Which modbus read function to use
  uint32 slave_address = 2; // Modbus slave address (1-247)
  uint32 start_address = 3; // Starting register/coil address
  uint32 quantity = 4; // Number of registers/coils to read (1-32)
}

// Response to a ModbusReadRequest.
message ModbusReadResponse {
  ModbusFunction function = 1; // Echo of the requested function

  // Raw response data from the modbus slave:
  //   For holding/input registers: 2 bytes per register, little-endian
  //   For coils/discrete inputs: 1 bit per coil, packed into bytes (LSB first)
  //
  // The routing bridge reassembles multi-frame CAN responses transparently.
  // The PC always receives the complete data in one message.
  bytes data = 2;

  // Error indicator. true if the read failed for any reason:
  //   - Modbus slave didn't respond (timeout)
  //   - Slave returned an exception response
  //   - CRC error on the RS485 bus
  // When true, data is empty and error_code contains the reason.
  bool error = 3;

  // Modbus exception code (only meaningful when error=true):
  //   1 = illegal function code
  //   2 = illegal data address (register doesn't exist)
  //   3 = illegal data value
  //   4 = slave device failure (internal error)
  //   0xFF = timeout (no response from slave within deadline)
  uint32 error_code = 4;
}

// ============================================================================
// Direct Write -- Single
// ============================================================================

// Write a single coil (Modbus function code 0x05).
// Response: CommandResult
//
// CAN mapping: CMD_RX byte 0x22: [slave:1][addr:2 LE][value:1]
message ModbusWriteCoilRequest {
  uint32 slave_address = 1; // Modbus slave address (1-247)
  uint32 address = 2; // Coil address
  bool value = 3; // true = ON (Modbus 0xFF00), false = OFF (Modbus 0x0000)
}

// Write a single holding register (Modbus function code 0x06).
// Response: CommandResult
//
// CAN mapping: CMD_RX byte 0x21: [slave:1][addr:2 LE][value:2 LE]
message ModbusWriteRegisterRequest {
  uint32 slave_address = 1; // Modbus slave address (1-247)
  uint32 address = 2; // Register address
  uint32 value = 3; // Register value (16-bit, stored in uint32 for proto3 compatibility)
}

// ============================================================================
// Poll Slot Configuration
// ============================================================================

// Configure an autonomous poll slot. The bridge allocates a slot (a "ticket")
// and returns its index — the host doesn't pick. Idempotent: if a slot
// already polls the same (slave, function, start_address, quantity) target,
// the bridge returns that slot's index with is_new=false instead of failing.
//
// Response: ModbusSetPollResponse
//
// The modbus device will read the specified registers from the slave and push
// results as ModbusPollResultEvent on the slot's data channel. All active
// slots are polled in round-robin order as fast as possible. Up to 16 slots
// can be active simultaneously.
//
// Each poll slot gets its own CAN data channel ID (base+0x02+slot), so
// poll results from different slots don't interfere with each other.
//
// Change detection: the device caches the last polled values per slot and
// only pushes a new event when values differ from the cache. This prevents
// flooding the CAN bus with identical readings.
//
// CAN mapping: CMD_RX byte 0x24: [slave:1][func:1][addr:2 LE][qty:1]
message ModbusSetPollRequest {
  uint32 slave_address = 1; // Modbus slave to poll (1-247)
  ModbusFunction function = 2; // Read function to use
  uint32 start_address = 3; // Starting register address
  uint32 quantity = 4; // Number of registers to read per poll (1-24)
}

// Response to ModbusSetPollRequest. On success (CommandResult sibling), the
// bridge returns the slot it has allocated (or matched, if dedup'd) and
// whether the slot was freshly created. Out-of-slots is signalled via the
// generic CommandResult error path with status NOT_READY.
message ModbusSetPollResponse {
  // Slot index 0-15. Slot's data channel is base+0x02+slot.
  uint32 slot = 1;
  // True when a fresh slot was allocated for this request. False when the
  // bridge already had a slot polling the same target and returned its index.
  bool is_new = 2;
}

// Deactivate a poll slot. Stops polling and frees the slot for reuse.
// Response: CommandResult
//
// CAN mapping: CMD_RX byte 0x25: [slot:1]
message ModbusClearPollRequest {
  uint32 slot = 1; // Slot index 0-15
}

// Query all active poll slot configurations.
// Response: ModbusPollConfigResponse
//
// CAN mapping: CMD_RX byte 0x26 (no payload)
// Response on CMD_TX: multi-frame with active slot configs
message ModbusGetPollsRequest {}

// Response to ModbusGetPollsRequest.
// Contains the configuration of all currently active poll slots.
message ModbusPollConfigResponse {
  repeated ModbusPollSlotConfig active_slots = 1;
}

// Configuration of a single active poll slot.
// Mirrors the fields from ModbusSetPollRequest.
message ModbusPollSlotConfig {
  uint32 slot = 1;
  uint32 slave_address = 2;
  ModbusFunction function = 3;
  uint32 start_address = 4;
  uint32 quantity = 5;
}

// ============================================================================
// Smart Poll Configuration
// ============================================================================

// Configure smart polling behavior for an active poll slot.
// The slot must already be configured via ModbusSetPollRequest.
// Response: CommandResult
//
// Smart polling enables change detection and delta reporting:
//   - Full report: first poll or every force_interval polls sends all registers
//   - Delta report: only changed registers are sent (saves CAN bandwidth)
//
// CAN mapping: CMD_RX byte 0x27: [slot:1][flags:1][force_interval:1]
message ModbusSetPollConfigRequest {
  uint32 slot = 1; // Slot index 0-15 (must already be active)
  uint32 flags = 2; // Bitmask: bit0=SMART (enable change detection + delta)
  uint32 force_interval = 3; // Full report every N polls (0 = default 10)
}

// Query the current polling state for a slot.
// Response: ModbusPollStatusResponse
//
// CAN mapping: CMD_RX byte 0x2B: [slot:1]
// Response: [0x2B][0x00][flags:1][force_counter:1][force_interval:1][active:1]
message ModbusGetPollStatusRequest {
  uint32 slot = 1; // Slot index 0-15
}

// Response to ModbusGetPollStatusRequest.
message ModbusPollStatusResponse {
  uint32 slot = 1; // Echo of requested slot
  uint32 flags = 2; // Current POLL_FLAG_* flags
  uint32 force_counter = 3; // Polls remaining until next forced full report
  uint32 force_interval = 4; // Configured force interval
  bool active = 5; // Whether the slot is active
}

// ============================================================================
// Timeout Safety
// ============================================================================

// Configure commands to execute automatically when the bridge loses contact
// with the PC. "Contact" = receiving any Ringbahn command. If no command is
// received for timeout_ms milliseconds, the modbus device executes all stored
// timeout commands sequentially.
//
// Response: CommandResult
//
// Use case: if the PC crashes while a VFD is running at speed, the timeout
// commands can write 0 to the speed register for safe shutdown.
//
// CAN mapping:
//   Individual timeout command storage: CMD_RX byte 0x2C:
//     Register write: [flags:1][slave:1][addr:2 LE][value:2 LE]  (7 bytes)
//     Coil write:     [0x80:1][slave:1][addr:2 LE][value:1]      (6 bytes)
//     flags bit 7: 0 = register, 1 = coil. Slot auto-assigned.
//     Dedupes on slave+addr+type — returns 0x04 if already exists.
//   Timeout period: CMD_RX byte 0x2E: [timeout:2 LE]
message ModbusSetTimeoutCommandsRequest {
  // Timeout period in milliseconds. Set to 0 to disable the timeout watchdog.
  // Default: 20000ms (20 seconds).
  // The watchdog is reset by any incoming command (including PingCommand).
  uint32 timeout_ms = 1;

  // Up to 16 write commands to execute when the timeout fires.
  // Commands execute in order. If any command fails (slave timeout, etc.),
  // the remaining commands still execute (best-effort).
  repeated ModbusTimeoutCommand commands = 2;
}

// A single write command stored for timeout execution.
// Only single-register and single-coil writes are supported (no multi-register
// writes in timeout commands, to keep the implementation simple).
message ModbusTimeoutCommand {
  oneof command {
    ModbusWriteCoilRequest write_coil = 1;
    ModbusWriteRegisterRequest write_register = 2;
  }
}

// Clear all stored timeout commands and disable the timeout watchdog.
// Response: CommandResult
//
// CAN mapping: CMD_RX byte 0x2D (no payload)
message ModbusClearTimeoutCommandsRequest {}

// ============================================================================
// Per-Register Delta Hysteresis
// ============================================================================
//
// Each poll slot's registers can be assigned an individual deadband threshold.
// A register is reported only when |new - last_reported| > hysteresis. The
// baseline is the last value actually transmitted, so slow drift below
// threshold-per-poll still accumulates and eventually fires. Threshold = 0
// matches the original strict-equality behaviour (any change reports).
// Coil/discrete-input slots reject these commands — hysteresis on a single
// bit is meaningless. Configuration is RAM-only and lost on reboot.

// One per-register threshold entry, used in the sparse form of
// ModbusSetRegisterHysteresisRequest.
message RegisterHysteresisEntry {
  uint32 register_offset = 1; // 0..23 (must be < slot's quantity)
  uint32 threshold = 2; // 0..65535 (deadband size in raw register units)
}

// Sparse list of per-register thresholds; bridge fans this out into one or
// more 0x30 SET_REGISTER_HYSTERESIS frames (two thresholds per frame when
// offsets are consecutive).
message RegisterHysteresisList {
  repeated RegisterHysteresisEntry entries = 1; // max 24 entries per slot
}

// Set delta hysteresis for a poll slot's registers. Use `uniform_threshold`
// to apply one value to all registers (maps to CAN 0x2F); use `per_register`
// for sparse overrides (maps to one or more 0x30 frames).
// Response: CommandResult
//
// CAN mapping (uniform): CMD_RX byte 0x2F: [slot:1][thresh:2 LE]
// CAN mapping (per_register): CMD_RX byte 0x30:
//     [slot:1][reg_offset:1][thr0:2 LE]              (DLC 5, single)
//     [slot:1][reg_offset:1][thr0:2 LE][thr1:2 LE]   (DLC 7, paired)
message ModbusSetRegisterHysteresisRequest {
  uint32 slot = 1; // 0..15, must be active and read-register type
  oneof config {
    uint32 uniform_threshold = 2; // Applied to all registers in the slot
    RegisterHysteresisList per_register = 3; // Sparse per-register overrides
  }
}

// Query the slot's current per-register thresholds.
// Response: ModbusGetRegisterHysteresisResponse
//
// CAN mapping: CMD_RX byte 0x31: [slot:1]
// Response: multi-frame CMD_TX burst terminated by [0x31][0xFF]
message ModbusGetRegisterHysteresisRequest {
  uint32 slot = 1;
}

// Response to ModbusGetRegisterHysteresisRequest.
// Thresholds are positionally indexed: thresholds[i] is the deadband for
// the register at offset i (i in 0..quantity-1).
message ModbusGetRegisterHysteresisResponse {
  uint32 slot = 1;
  repeated uint32 thresholds = 2; // length == slot quantity, max 24
}

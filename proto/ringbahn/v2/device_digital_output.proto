syntax = "proto3";

package ringbahn.v2;

// ============================================================================
// Digital Output / PWM Commands
// ============================================================================
//
// The digital output device (DEVICE_TYPE_DIGITAL_OUT) controls up to 8 PWM
// output channels via MCP4131 digital potentiometers. Each channel has 8-bit
// resolution (0-255 duty cycle).
//
// This device is command-driven (no subscriptions). The PC sets channel values
// and they remain until changed or the device resets (all channels default to 0).
//
// CAN MAPPING:
//   SetPWMChannelRequest  -> CMD_RX byte 0x20: [channel:1][duty_cycle:1]
//   SetAllChannelsRequest -> CMD_RX byte 0x21: [ch0:1][ch1:1][ch2:1]...[ch7:1]
//   Both respond with CMD_TX: [cmd_echo:1][0x00] (status OK)
//

// Set the duty cycle of a single PWM channel.
// Response: CommandResult
message SetPWMChannelRequest {
  uint32 channel = 1;    // Channel index 0-7 (out of range = error)
  uint32 duty_cycle = 2; // PWM duty cycle: 0 = fully off, 255 = fully on
}

// Set all 8 channels simultaneously in a single CAN frame.
// Response: CommandResult
//
// This is more efficient than 8 individual SetPWMChannelRequest calls
// when updating multiple channels at once (1 CAN frame vs 8).
message SetAllChannelsRequest {
  // Exactly 8 bytes: byte[0] = channel 0 duty, ..., byte[7] = channel 7 duty.
  // Each byte: 0 = fully off, 255 = fully on.
  // If fewer than 8 bytes are provided, missing channels are set to 0.
  bytes packed_duty_cycles = 1;
}

// Current state of all output channels.
// Used in BridgeResponse when the PC queries digital output state.
message DigitalOutputState {
  // 8 bytes, same format as SetAllChannelsRequest.
  // byte[0] = channel 0 current duty cycle, etc.
  bytes packed_duty_cycles = 1;
}

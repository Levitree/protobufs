syntax = "proto3";

package ringbahn.v1;

enum DeviceType {
  DEVICE_TYPE_UNSPECIFIED = 0; // Unknown Device
  DEVICE_TYPE_HUB = 1; // Main Hub
  DEVICE_TYPE_NODE = 2; // Node Module
  DEVICE_TYPE_SD_ADC = 3; // Sigma Delta ADC
  DEVICE_TYPE_DIGITAL_OUT = 4; // Digital output / PWM bridge
  DEVICE_TYPE_RS485_BRIDGE = 5; // RS485 Bridge
  DEVICE_TYPE_BLDC = 6; // BLDC
  DEVICE_TYPE_BLDC_CONTROLLER = 7; // BLDC Controller (joystick/button pad)
  DEVICE_TYPE_TERRABOOT = 254; // No app!
}

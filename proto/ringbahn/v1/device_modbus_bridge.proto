syntax = "proto3";

package ringbahn.v1;

import "ringbahn/v1/device_common.proto";

// ===== Serial Port Configuration Enums =====

// Standard baud rates
enum SerialBaudRate {
  SERIAL_BAUD_RATE_UNSPECIFIED = 0;
  SERIAL_BAUD_RATE_1200 = 1;
  SERIAL_BAUD_RATE_2400 = 2;
  SERIAL_BAUD_RATE_4800 = 3;
  SERIAL_BAUD_RATE_9600 = 4;
  SERIAL_BAUD_RATE_19200 = 5; // Default
  SERIAL_BAUD_RATE_38400 = 6;
  SERIAL_BAUD_RATE_57600 = 7;
  SERIAL_BAUD_RATE_115200 = 8;
}

// Parity settings
enum SerialParity {
  SERIAL_PARITY_UNSPECIFIED = 0;
  SERIAL_PARITY_NONE = 1; // Default
  SERIAL_PARITY_ODD = 2;
  SERIAL_PARITY_EVEN = 3;
}

// Stop bits
enum SerialStopBits {
  SERIAL_STOP_BITS_UNSPECIFIED = 0;
  SERIAL_STOP_BITS_1 = 1; // Default
  SERIAL_STOP_BITS_2 = 2;
}

// Top-level Modbus Bridge device command message
message ModbusBridgeDeviceCommand {
  oneof command {
    // Common commands
    SystemInfoRequest system_info = 1; // Response: SystemInfoResponse
    PingCommand ping = 2; // Response: CommandResult
    ResetCommand reset = 3; // Response: CommandResult
    IdentifyCommand identify = 4; // Response: CommandResult

    // UART configuration
    ConfigureUartRequest configure_uart = 5; // Response: CommandResult

    // Modbus-specific commands
    ModbusReadCoilsRequest read_coils = 10; // Response: ModbusReadCoilsResponse
    ModbusReadDiscreteInputsRequest read_discrete_inputs = 11; // Response: ModbusReadDiscreteInputsResponse
    ModbusReadHoldingRegistersRequest read_holding_registers = 12; // Response: ModbusReadHoldingRegistersResponse
    ModbusReadInputRegistersRequest read_input_registers = 13; // Response: ModbusReadInputRegistersResponse
    ModbusWriteSingleCoilRequest write_single_coil = 14; // Response: CommandResult
    ModbusWriteSingleRegisterRequest write_single_register = 15; // Response: CommandResult
    ModbusWriteMultipleCoilsRequest write_multiple_coils = 16; // Response: CommandResult
    ModbusWriteMultipleRegistersRequest write_multiple_registers = 17; // Response: CommandResult

    // Timeout safety commands
    SetTimeoutCommandsRequest set_timeout_commands = 18; // Response: CommandResult
    ClearTimeoutCommandsRequest clear_timeout_commands = 19; // Response: CommandResult
    GetTimeoutConfigRequest get_timeout_config = 20; // Response: TimeoutConfigResponse
  }
}

// ===== UART Configuration =====

// Response: CommandResult
message ConfigureUartRequest {
  SerialBaudRate baud_rate = 1; // Baud rate (default: SERIAL_BAUD_RATE_19200)
  SerialParity parity = 2; // Parity (default: SERIAL_PARITY_NONE)
  SerialStopBits stop_bits = 3; // Stop bits (default: SERIAL_STOP_BITS_1)
}

// ===== Modbus Read Commands =====

// Response: ModbusReadCoilsResponse
message ModbusReadCoilsRequest {
  uint32 slave_address = 1; // Modbus slave address (1-247);
  uint32 starting_address = 2; // Starting coil address;
  uint32 quantity = 3; // Number of coils to read (1-32);
}

// Packed format: [quantity:1][coil_bits:ceil(N/8)]
// - Byte 0: quantity (1-32)
// - Bytes 1-4: bit-packed coils (bit 0 of byte 1 = coil 0)
// - Error: [0xFF][error_code:1]
message ModbusReadCoilsResponse {
  bytes packed_data = 1; // max_size: 5
}

// Response: ModbusReadDiscreteInputsResponse
message ModbusReadDiscreteInputsRequest {
  uint32 slave_address = 1; // Modbus slave address (1-247);
  uint32 starting_address = 2; // Starting discrete input address;
  uint32 quantity = 3; // Number of discrete inputs to read (1-32);
}

// Packed format: [quantity:1][input_bits:ceil(N/8)]
// - Byte 0: quantity (1-32)
// - Bytes 1-4: bit-packed inputs (bit 0 of byte 1 = input 0)
// - Error: [0xFF][error_code:1]
message ModbusReadDiscreteInputsResponse {
  bytes packed_data = 1; // max_size: 5
}

// Response: ModbusReadHoldingRegistersResponse
message ModbusReadHoldingRegistersRequest {
  uint32 slave_address = 1; // Modbus slave address (1-247);
  uint32 starting_address = 2; // Starting register address;
  uint32 quantity = 3; // Number of registers to read (1-32);
}

// Packed format: [quantity:1][values:2*N little-endian]
// - Byte 0: quantity (1-32)
// - Bytes 1-2N: uint16 values in little-endian
// - Error: [0xFF][error_code:1]
message ModbusReadHoldingRegistersResponse {
  bytes packed_data = 1; // max_size: 65
}

// Response: ModbusReadInputRegistersResponse
message ModbusReadInputRegistersRequest {
  uint32 slave_address = 1; // Modbus slave address (1-247);
  uint32 starting_address = 2; // Starting register address;
  uint32 quantity = 3; // Number of registers to read (1-32);
}

// Packed format: [quantity:1][values:2*N little-endian]
// - Byte 0: quantity (1-32)
// - Bytes 1-2N: uint16 values in little-endian
// - Error: [0xFF][error_code:1]
message ModbusReadInputRegistersResponse {
  bytes packed_data = 1; // max_size: 65
}

// ===== Modbus Write Commands =====

// Response: CommandResult
message ModbusWriteSingleCoilRequest {
  uint32 slave_address = 1; // Modbus slave address (1-247);
  uint32 coil_address = 2; // Coil address;
  bool value = 3; // Coil value;
}

// Response: CommandResult
message ModbusWriteSingleRegisterRequest {
  uint32 slave_address = 1; // Modbus slave address (1-247);
  uint32 register_address = 2; // Register address;
  uint32 value = 3; // Register value;
}

// Response: CommandResult
// Packed format: [slave_addr:1][start_addr:2 LE][quantity:1][coil_bits:ceil(N/8)]
message ModbusWriteMultipleCoilsRequest {
  bytes packed_data = 1; // max_size: 8
}

// Response: CommandResult
// Packed format: [slave_addr:1][start_addr:2 LE][quantity:1][values:2*N LE]
message ModbusWriteMultipleRegistersRequest {
  bytes packed_data = 1; // max_size: 68
}

// ===== Timeout Safety Configuration =====

// A single Modbus write command for timeout safety
message TimeoutWriteCommand {
  oneof command {
    ModbusWriteSingleCoilRequest write_coil = 1;
    ModbusWriteSingleRegisterRequest write_register = 2;
    ModbusWriteMultipleRegistersRequest write_registers = 3;
  }
}

// Configure commands to execute when ping timeout occurs
// Response: CommandResult
message SetTimeoutCommandsRequest {
  uint32 timeout_ms = 1; // Timeout period in ms (0 = disable, default: 20000)
  repeated TimeoutWriteCommand commands = 2; // Max 8 commands
}

// Clear timeout configuration
// Response: CommandResult
message ClearTimeoutCommandsRequest {
  // Empty - clears all stored timeout commands
}

// Query timeout status
// Response: TimeoutConfigResponse
message GetTimeoutConfigRequest {
  // Empty
}

// Response with current timeout configuration
message TimeoutConfigResponse {
  uint32 timeout_ms = 1; // Current timeout period (0 = disabled)
  uint32 command_count = 2; // Number of stored commands
  bool timeout_active = 3; // True if currently in timeout state
  uint32 last_ping_elapsed_ms = 4; // Milliseconds since last ping
}

syntax = "proto3";

package ringbahn.v1;

import "ringbahn/v1/enums.proto";

// 6-byte identifier carried inside Ringbahn frames
message DeviceUUID {
  bytes value = 1; // Fixed-length 6 byte unique identifier
}

// Standard command response shared across device protocols
message CommandResult {
  bool success = 1;
  uint32 error_code = 2;
  string detail = 3; // Optional human-readable detail
}

// Device information returned during discovery
message DeviceInfo {
  DeviceType device_type = 1;
  DeviceUUID device_uuid = 2; //6-byte Ringbahn device identifier.
}

// GPS location and telemetry data shared by mobile devices
message GPSState {
  float latitude = 1; // Latitude in degrees;
  float longitude = 2; // Longitude in degrees;
  float altitude = 3; // Altitude in meters;
  float speed = 4; // Speed in m/s;
  float heading = 5; // Heading in degrees;
  uint32 satellites = 6; // Number of satellites used for the fix;
  bool has_fix = 7;
}

syntax = "proto3";

package ringbahn.v1;

import "ringbahn/v1/device_common.proto";

// Top-level Digital Output device command message
message DigitalOutputDeviceCommand {
  oneof command {
    // Common commands
    SystemInfoRequest system_info = 1; // Response: SystemInfoResponse
    PingCommand ping = 2; // Response: CommandResult
    ResetCommand reset = 3; // Response: CommandResult
    IdentifyCommand identify = 4; // Response: CommandResult

    // Digital Output-specific commands
    SetPWMChannelRequest set_channel = 10; // Response: CommandResult
    DigitalOutputGetStateRequest get_state = 11; // Response: DigitalOutputState
    SetAllChannelsRequest set_all_channels = 12; // Response: CommandResult
  }
}

// ===== Digital Output-Specific Commands =====

// Response: CommandResult
message SetPWMChannelRequest {
  int32 channel_number = 1; // Channel 0-7 (max 8 channels per device)
  uint32 duty_cycle = 2; // PWM duty cycle (0-255)
}

// Response: CommandResult
// Packed format: 1 byte per channel (duty cycle 0-255)
message SetAllChannelsRequest {
  bytes packed_duty_cycles = 1;
}

// Response: DigitalOutputState
message DigitalOutputGetStateRequest {}

// Complete Digital Output device state
// Packed format: 1 byte per channel (duty cycle 0-255)
// Byte 0 = channel 0 duty, Byte 1 = channel 1 duty, etc.
message DigitalOutputState {
  bytes packed_duty_cycles = 1;
}
